name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: proctor
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: proctor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proctor" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://proctor:ci@localhost:5432/proctor_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run gen && git diff --exit-code src/api-types.ts
      - run: npx playwright install --with-deps chromium-headless-shell # layout tests run in real Chromium
      - run: npm test
      - run: npm run build

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x -P SCRIPTDIR infra/*.sh
