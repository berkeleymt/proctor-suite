name: proctor

services:
  caddy:
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in infra/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # One-shot: applies Alembic migrations, then exits. The app waits for it (invariant 10: the app
  # process itself never migrates). deploy.sh also runs it explicitly before restarting anything.
  migrate:
    build: ../server
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://proctor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/proctor
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: ../server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://proctor:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}@postgres:5432/proctor
      ROOM_PASSWORD: ${ROOM_PASSWORD:?set ROOM_PASSWORD in infra/.env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in infra/.env}
      # Site name and icon (the first values; the super-admin page can change them later).
      APP_NAME: ${APP_NAME:?set APP_NAME in infra/.env}
      APP_ICON: ${APP_ICON:-}
      # Super-admin page: Google sign-in, plus the emails that may always open it.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      # Roster sync (optional; leave empty to use CSV import only). See docs/setup-contestdojo.md.
      CONTESTDOJO_API_URL: ${CONTESTDOJO_API_URL:-}
      CONTESTDOJO_API_TOKEN: ${CONTESTDOJO_API_TOKEN:-}
      CONTESTDOJO_EVENT_ID: ${CONTESTDOJO_EVENT_ID:-}
      CONTESTDOJO_ROOM_KEY: ${CONTESTDOJO_ROOM_KEY:-}
      SEED_ROOMS: ${SEED_ROOMS:-Dwinelle 145,Evans 10,Soda 306,Wheeler 150}
      SESSION_DURATION_MIN: ${SESSION_DURATION_MIN:-60}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proctor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: proctor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctor -d proctor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  pgdata:
